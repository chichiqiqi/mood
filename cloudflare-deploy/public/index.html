<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Mood</title><link rel="stylesheet" href="mood.css"></head>
<body><main id="app">
<section id="home" class="page"><header><h1>Mood</h1><button data-go="calendar" class="icon" aria-label="打开猫咪日历"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v6M16 2v6"/></svg></button></header><div class="welcome"><div class="box-cat"><img src="assets/home-cat.png" alt="歪头看你的纸盒小猫"></div><h2>喵，今天心情怎么样？</h2></div><button class="primary bottom" id="enter">识别心情</button></section>
<section id="capture" class="page" hidden><header><button class="icon back" id="cameraBack" aria-label="返回">←</button></header><div class="photo-stage"><p class="hint" id="hint">请看向镜头</p><div class="frame"><video id="video" autoplay playsinline muted hidden></video><img id="photo" alt="本次拍摄的照片" hidden><div id="cameraIdle"><span class="cat" data-cat="Neutral"></span><button class="primary" id="openCamera">打开摄像头</button></div></div></div><div class="capture-content"><div id="shutterArea"><button id="shutter" aria-label="拍照" disabled></button><span>拍照</span></div><div id="loading" role="status" aria-label="正在识别" hidden><div class="orbit"><span class="cat" data-cat="Neutral"></span></div></div><div id="results" hidden><div id="predictions"></div></div><div id="choose" hidden><h2>今天感觉怎么样呢？</h2><div id="choices"></div></div></div><div id="resultActions" class="bottom actions" hidden><button class="secondary" id="correct">不太准哦</button><button class="primary" id="saveModel">保存</button></div><button class="primary bottom" id="saveChoice" hidden disabled>保存</button><div id="error" role="alert" hidden><p></p><button class="secondary" id="retry">再试一次</button></div></section>
<section id="calendar" class="page" hidden><header><h1>Mood</h1><button class="icon" data-go="home" aria-label="回到首页">⌂</button></header><div class="month-nav"><button class="icon" id="prevMonth" aria-label="上个月">‹</button><h2 id="monthTitle"></h2><button class="icon" id="nextMonth" aria-label="下个月">›</button></div><div class="week" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div id="days"></div></section>
<section id="viewer" class="page" role="dialog" aria-modal="true" aria-label="照片回顾" hidden><header><button class="icon" id="deleteRecord" aria-label="删除这个瞬间"><svg viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></svg></button><h2 id="viewerDate"></h2><button class="icon close" id="closeViewer" aria-label="关闭">×</button></header><div id="viewerBody"><img id="viewerPhoto" alt="这次记录的照片"><span id="viewerCat" class="cat"></span></div><div class="viewer-controls"><button class="icon" id="previous" aria-label="上一张">‹</button><button class="icon" id="next" aria-label="下一张">›</button></div></section>
<p id="toast" role="status" hidden></p></main><script type="module" src="mood.mjs?v=20261118-compat"></script></body></html>
