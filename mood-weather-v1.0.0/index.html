<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晴绪 · 本地模型测试</title><style>body{font:16px system-ui;background:#f7f8f3;color:#30432f;max-width:900px;margin:45px auto;padding:24px}h1{font-size:30px}p{line-height:1.7;color:#71816b}video{width:100%;max-height:360px;background:#e6ecdf;border-radius:16px;transform:scaleX(-1)}button{padding:13px 20px;border:0;border-radius:8px;background:#526d4d;color:white;font:inherit;margin:15px 10px 0 0;cursor:pointer}button:disabled{opacity:.5}.row{display:grid;grid-template-columns:85px 1fr 60px;align-items:center;gap:15px;margin:15px 0}progress{width:100%;accent-color:#78966a}.card{padding:24px;background:white;border-radius:16px;margin:20px 0}small{color:#7c8974}#status{min-height:28px}</style><h1>晴绪 · 本地模型测试</h1><p>EmotiEffLib · enet_b2_8<br>识别整张脸的表情类别。画面仅传给这台电脑上的程序，不上传云端、不保存照片。</p><video id="video" autoplay muted playsinline></video><button id="start">开始摄像头</button><button id="measure" disabled>观察 5 秒</button><button id="stop" disabled>关闭摄像头</button><p id="status" role="status">先启动摄像头，自然面对镜头。</p><div class="card"><h2 id="title">等待观察</h2><div id="scores"></div><small>百分比是模型对表情类别的相对分配，不是心情分数或经过校准的可信概率。该模型不输出连续正负向值，因此这里不自行拼出“开心值”。</small></div><p>建议分别试：自然放松、轻笑、皱眉、张嘴、说话。记录它能否稳定分辨；看到“开心表情”也不代表内心一定开心。</p><script>
const $=id=>document.getElementById(id),names={Anger:'愤怒表情',Contempt:'轻蔑表情',Disgust:'厌恶表情',Fear:'恐惧表情',Happiness:'开心表情',Neutral:'中性表情',Sadness:'难过表情',Surprise:'惊讶表情'};let stream=null,generation=0;
function stop(){generation++;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;$('start').disabled=false;$('measure').disabled=true;$('stop').disabled=true;}
$('stop').onclick=()=>{stop();$('status').textContent='摄像头已关闭。'};window.addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
$('start').onclick=async()=>{let g=++generation;$('start').disabled=true;try{let s=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480},audio:false});if(g!==generation){s.getTracks().forEach(t=>t.stop());return}stream=s;$('video').srcObject=s;await $('video').play();$('measure').disabled=false;$('stop').disabled=false;$('status').textContent='摄像头已启动。点击观察，连续分析 5 秒。'}catch{stop();$('status').textContent='摄像头无法启动，请检查浏览器和系统摄像头权限，或关闭占用摄像头的应用。'}};
$('measure').onclick=async()=>{const g=generation;$('measure').disabled=true;let results=[],canvas=document.createElement('canvas');canvas.width=640;canvas.height=480;let begin=performance.now();try{while(performance.now()-begin<5000){if(g!==generation)return;canvas.getContext('2d').drawImage($('video'),0,0,640,480);let blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.8));let res=await fetch('/analyze',{method:'POST',headers:{'Content-Type':'image/jpeg'},body:blob,signal:AbortSignal.timeout(15000)});let data=await res.json();if(g!==generation)return;if(data.scores)results.push(data.scores);$('status').textContent=data.error||'正在观察，已取得 '+results.length+' 个有效样本……';await new Promise(r=>setTimeout(r,200));}if(results.length<3){$('status').textContent='有效样本不足，请改善光线、正对镜头后重试。';return}let avg=Object.keys(names).map(k=>[k,results.reduce((s,r)=>s+r[k],0)/results.length]).sort((a,b)=>b[1]-a[1]);$('scores').replaceChildren();for(let [k,v]of avg){let row=document.createElement('div');row.className='row';let label=document.createElement('span');label.textContent=names[k];let bar=document.createElement('progress');bar.max=1;bar.value=v;let val=document.createElement('span');val.textContent=(v*100).toFixed(1)+'%';row.append(label,bar,val);$('scores').append(row)}$('title').textContent=avg[0][1]<.5||avg[0][1]-avg[1][1]<.15?'表情结果不确定':'更接近：'+names[avg[0][0]];$('status').textContent='观察完成，平均了 '+results.length+' 个样本。';}catch{if(g===generation)$('status').textContent='本地识别连接失败，请检查本机程序是否运行。'}finally{if(g===generation&&stream)$('measure').disabled=false}};
</script></html>
