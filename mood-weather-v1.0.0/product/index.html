<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心情天气 · 心情观察</title><link rel="stylesheet" href="style.css?v=gallery1"><body><div class="sky" aria-hidden="true"><div class="sunlight"></div><div class="cloud cloud-one"></div><div class="cloud cloud-two"></div><div class="cloud cloud-three"></div></div><header><a class="brand" href="#">心情天气<span>✳</span></a><nav><a href="#observe" id="navNow">此刻</a><a href="#flow">心流 ↗</a></nav></header><main><div class="hero"><div class="hero-content"><h1>此刻的你，<br>是什么天气？</h1><button class="hero-button" id="enter">看看此刻 <span>↗</span></button></div><a class="scroll-cue" href="#flow">心流 <span>↓</span></a><div class="cat-scene" aria-hidden="true"><div class="cat-shadow"></div><div class="cat-body"></div><div class="cat-head"></div></div></div><div id="observe" class="grid" hidden><section class="camera"><span id="badge" hidden></span><div class="viewport"><video id="video" autoplay muted playsinline></video><img id="frozenPhoto" hidden alt="刚拍下的照片"><span class="lens-hint" hidden>请看向镜头</span><div id="placeholder"><div class="face">◡</div><h3>和自己，打个照面</h3><p>观察整张脸的表情，听听自己的感受</p></div></div><p id="status" role="status">画面仅在本机处理；保存心情时会一起保存一张快照，不保存视频。</p><div class="actions"><button class="primary" id="start">◎ 打开摄像头</button><button id="stop" disabled>停止</button></div><div class="calibration"><button id="calibrate">校准自然放松基准 · 8 秒</button><button id="resetBaseline">重置基准</button><p id="baselineStatus"></p></div><div class="result"><span>表情识别</span><div id="signals"></div><p id="feedback">完成观察后显示前三项表情猜测。</p><p id="quality"></p><img id="snapshot" hidden alt="本次观察快照，保存心情时一同保存在当前浏览器"></div></section><div><section class="checkin"><h2>你自己感觉怎么样？</h2><div id="moods" class="moods"></div><label for="note">留一句话给此刻的自己 <small>可选</small></label><textarea id="note" maxlength="240" placeholder="刚喝了一杯喜欢的咖啡……"></textarea><button class="primary" id="save">保存这份心情</button><p id="saved" role="status"></p></section></div></div><section class="history" id="flow"><div class="section-title"><div><h2>心流</h2></div><select id="range" aria-label="记录范围"><option value="7">最近 7 天</option><option value="30">最近 30 天</option></select></div><p id="summary"></p><div id="chart" class="chart"></div><div class="legend">每个点代表当天记录的整体心情　 <span>面部动作单独保留在记录中</span></div><div id="records"></div></section><footer>慢慢来，每一种心情都有自己的位置。<button id="clear">清除本机记录</button></footer></main><script>(function(){
const $=id=>document.getElementById(id),key='mood-notes-v1';let records=[];try{records=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(records))records=[]}catch{}let baseline=null;try{baseline=JSON.parse(localStorage.getItem('mood-baseline-v1')||'null')}catch{}let pendingPhoto=null;let mood=null,lastScore=null,model,stream,running=false,token=0;const labels=['低落','有点低','平静','不错','很开心'],faces=['☂','☁','◡','☀','✺'];labels.forEach((label,i)=>{let b=document.createElement('button');b.innerHTML=faces[i]+'<span>'+label+'</span>';b.onclick=()=>{mood=i+1;[...$('moods').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('moods').append(b)});
function day(t){let d=new Date(t);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function render(){let n=Number($('range').value),days=Array.from({length:n},(_,i)=>{let d=new Date();d.setDate(d.getDate()-n+1+i);return day(d)});renderFlow(days);let today=records.filter(r=>day(r.time)===day(Date.now())),prior=records.filter(r=>days.slice(0,-1).includes(day(r.time)));const grouped=days.map(d=>{let items=records.filter(r=>day(r.time)===d);return items.length?{date:d,count:items.length,mean:items.reduce((sum,r)=>sum+r.mood,0)/items.length}:null}).filter(Boolean);const tone=v=>v<1.5?'低落':v<2.5?'有些低落':v<3.5?'平静':v<4.5?'愉快':'开心';let text;if(!grouped.length){text='还没有留下心情，心流从你想记录的那一刻开始。'}else if(grouped.length===1){let d=grouped[0],when=d.date===day(Date.now())?'今天':d.date.slice(5).replace('-','月')+'日';text=when+'留下了 '+d.count+' 个心情瞬间，整体'+tone(d.mean)+'。'}else{let first=grouped[0],last=grouped[grouped.length-1],delta=last.mean-first.mean,span=Math.max(...grouped.map(d=>d.mean))-Math.min(...grouped.map(d=>d.mean));let change=Math.abs(delta)>=.6?(delta>0?'从起初的'+tone(first.mean)+'，到最近的'+tone(last.mean)+'，心情有所回升。':'从起初的'+tone(first.mean)+'，到最近的'+tone(last.mean)+'，心情有所回落。'):span>=1?'心情有过起伏，最近又回到了与起初接近的状态。':'心情整体比较平稳，最近'+tone(last.mean)+'。';text='在这 '+grouped.length+' 个有记录的日子里，'+change}$('summary').textContent=text;$('records').replaceChildren();for(let r of records.filter(r=>days.includes(day(r.time))).slice().reverse().slice(0,20)){let el=document.createElement('div');el.className='record';let a=document.createElement('div');a.textContent=new Date(r.time).toLocaleString('zh-CN')+' · '+labels[r.mood-1];let p=document.createElement('p');p.textContent=r.note;a.append(p);let s=document.createElement('span');s.textContent=r.expression?r.expression.summary:r.smile==null?'未观察表情':`旧版嘴角信号 ${r.smile}/100（不与新版比较）`;if(r.photo&&r.photo.startsWith('data:image/jpeg;base64,')){let img=document.createElement('img');img.src=r.photo;img.alt='这次心情记录的观察快照';img.className='record-photo';img.loading='lazy';img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label','放大照片，'+new Date(r.time).toLocaleString('zh-CN')+'，'+labels[r.mood-1]);img.onclick=()=>openPhoto(r);img.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPhoto(r)}};a.prepend(img);}else{let no=document.createElement('small');no.textContent='无快照（旧记录或未观察）';a.append(no)}el.append(a);$('records').append(el)}}
$('save').onclick=()=>{if($('start').disabled){$('saved').textContent='观察尚未结束，请等待快照预览出现后再保存。';return}if(!mood){$('saved').textContent='先选择此刻的心情。';return}let r={time:new Date().toISOString(),mood,note:$('note').value.trim(),smile:null,expression:lastScore,photo:pendingPhoto};try{localStorage.setItem(key,JSON.stringify([...records,r]));records.push(r);$('saved').textContent=r.photo?'心情和快照已一起保存。':'已保存心情（本次没有快照）。先完成观察可保存照片。';$('note').value='';lastScore=null;pendingPhoto=null;$('snapshot').hidden=true;showSignals(null);render()}catch{$('saved').textContent='保存失败：本机存储可能已满或被禁用。请检查浏览器存储空间后重试。'}};$('range').onchange=render;$('clear').onclick=()=>{if(confirm('确定清除当前浏览器的全部心情记录？此操作无法撤销。')){try{localStorage.removeItem(key);records=[];render()}catch{$('saved').textContent='清除失败。'}}};
function stop(){document.querySelector(".lens-hint").hidden=true;running=false;token++;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;$('video').style.display='none';$('placeholder').style.display='block';$('start').disabled=false;$('start').textContent='◎ 打开摄像头';$('stop').disabled=true;$('badge').textContent='● 摄像头已关闭';$('calibrate').disabled=false;$('resetBaseline').disabled=false}
$('stop').onclick=()=>{stop();$('status').textContent='观察已停止，本次结果未保存。'};document.addEventListener('visibilitychange',()=>{if(document.hidden&&$('start').disabled)stop()});window.addEventListener('pagehide',stop);
async function observe(){if(!stream){$('frozenPhoto').hidden=true;document.querySelector('.viewport').hidden=false;let mine=++token;lastScore=null;pendingPhoto=null;$('snapshot').hidden=true;$('start').disabled=true;$('start').textContent='正在请求摄像头…';$('status').textContent='请允许摄像头权限。';try{if(!navigator.mediaDevices?.getUserMedia)throw Error('CAMERA_UNAVAILABLE');let acquired=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});if(mine!==token){acquired.getTracks().forEach(t=>t.stop());return}stream=acquired;$('video').srcObject=stream;await $('video').play();if(mine!==token)return;document.documentElement.style.setProperty('--capture-ratio',String(($('video').videoWidth||640)/($('video').videoHeight||480)));$('video').style.display='block';$('placeholder').style.display='none';document.querySelector('.lens-hint').hidden=false;$('start').textContent='◎ 拍照';$('start').disabled=false;$('status').textContent='准备好后，点击拍照。';}catch{stop();$('status').textContent='摄像头无法打开，请检查权限。'}return;}let mine=token;$('start').disabled=true;$('start').textContent='分析中…';$('signals').replaceChildren();try{const canvas=document.createElement('canvas');canvas.width=$('video').videoWidth;canvas.height=$('video').videoHeight;canvas.getContext('2d').drawImage($('video'),0,0);let thumb=document.createElement('canvas');thumb.width=Math.min(640,canvas.width);thumb.height=Math.round(thumb.width*canvas.height/canvas.width);thumb.getContext('2d').drawImage(canvas,0,0,thumb.width,thumb.height);const latestPhoto=thumb.toDataURL('image/jpeg',.85);$('frozenPhoto').src=latestPhoto;$('frozenPhoto').hidden=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;$('video').style.display='none';$('placeholder').style.display='none';document.querySelector('.lens-hint').hidden=true;let loading=document.createElement('div');loading.className='analysis-loading';loading.textContent='正在分析这张照片…';$('signals').replaceChildren(loading);let blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.85));$('status').textContent='正在分析这张照片…';let response=await fetch('/analyze',{method:'POST',headers:{'Content-Type':'image/jpeg'},body:blob,signal:AbortSignal.timeout(30000)});if(!response.ok)throw Error('inference');let data=await response.json();if(mine!==token)return;if(!data.scores){$('signals').textContent=data.error||'没有识别到人脸，请重新拍照。';$('status').textContent=data.error||'请重新拍照';$('start').disabled=false;$('start').textContent='◎ 重新拍照';return;}let samples=[data.scores];stop();$('status').textContent='';$('signals').replaceChildren();const names={Anger:'愤怒',Contempt:'轻蔑',Disgust:'厌恶',Fear:'恐惧',Happiness:'开心',Neutral:'中性',Sadness:'难过',Surprise:'惊讶'};let scores=Object.keys(names).map(k=>({label:k,value:samples.reduce((s,r)=>s+r[k],0)/1})).sort((a,b)=>b.value-a.value);let uncertain=scores[0].value<.5||scores[0].value-scores[1].value<.15;for(const item of scores.slice(0,3)){let row=document.createElement('div');row.className='signal';let label=document.createElement('span'),value=document.createElement('b');label.textContent=names[item.label]+'表情';value.textContent=(item.value*100).toFixed(1)+'%';row.append(label,value);$('signals').append(row)}let summary=(uncertain?'结果混合／不确定：':'模型更接近：')+names[scores[0].label]+'／'+names[scores[1].label];$('feedback').textContent=summary+'。这是表情类别的相对分配，不是真实心情的概率，也不判断笑容真假。';$('quality').textContent=`有效样本 ${samples.length} / ${1}；本次只分析你拍下的这张照片。`;pendingPhoto=latestPhoto;$('snapshot').src=pendingPhoto;$('snapshot').hidden=false;lastScore={version:3,model:'enet_b2_8',summary,scores,uncertain,validFrames:samples.length,totalFrames:1};$('status').textContent='';}catch(e){if(mine!==token)return;$('start').disabled=false;$('start').textContent='◎ 重新拍照';$('status').textContent='照片分析失败，请重试，或检查本机模型连接。';}}
function baselineStatus(){$('baselineStatus').textContent=baseline?'已校准 · '+new Date(baseline.time).toLocaleString('zh-CN')+'。更换位置或光线后建议重新校准。':'尚未校准，使用通用动作阈值。校准时自然放松，不说话、不刻意微笑。'}

$('calibrate').onclick=()=>observe(true);$('start').onclick=()=>observe(false);$('resetBaseline').onclick=()=>{try{localStorage.removeItem('mood-baseline-v1');baseline=null;lastScore=null;showSignals(null);baselineStatus();$('feedback').textContent='基准已重置，请重新观察。'}catch{$('baselineStatus').textContent='无法重置基准，请检查本地存储权限。'}};$('calibrate').hidden=true;$('resetBaseline').hidden=true;$('baselineStatus').textContent='EmotiEffLib · 本机运行。结果仅为模型猜测，你的自评决定心情记录。';$('start').textContent='◎ 打开摄像头';showSignals(null);render();


function renderFlow(days){const host=$('chart');host.replaceChildren();const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 700 200');svg.setAttribute('role','img');svg.setAttribute('aria-label','心情曲线：上方开心，中间平静，下方低落；点为每日自评平均，空缺日期不连线');function el(tag,attrs){let n=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);svg.append(n);return n}const pts=days.map((d,i)=>{let rs=records.filter(r=>day(r.time)===d);return rs.length?{x:65+i*610/Math.max(1,days.length-1),y:160-(rs.reduce((s,r)=>s+r.mood,0)/rs.length-1)*34,d,count:rs.length}:null});for(const [v,label]of [[5,'开心'],[3,'平静'],[1,'低落']]){let y=160-(v-1)*34;el('line',{x1:60,x2:680,y1:y,y2:y,stroke:'#9caeb5','stroke-opacity':'.2','stroke-dasharray':'3 7'});el('text',{x:0,y:y+4,fill:'#7e929b','font-size':12}).textContent=label}let segments=[],part=[];for(const p of pts){if(p)part.push(p);else if(part.length){segments.push(part);part=[]}}if(part.length)segments.push(part);for(const segment of segments){if(segment.length>1){let path='M '+segment[0].x+' '+segment[0].y;for(let i=1;i<segment.length;i++){const prev=segment[i-1],p=segment[i],mid=(prev.x+p.x)/2;path+=' C '+mid+' '+prev.y+', '+mid+' '+p.y+', '+p.x+' '+p.y}el('path',{d:path,fill:'none',stroke:'#7297a8','stroke-width':3,'stroke-linecap':'round','stroke-linejoin':'round'})}for(const p of segment){let dot=el('circle',{cx:p.x,cy:p.y,r:4,fill:'#7297a8',stroke:'#fff','stroke-width':2});let title=document.createElementNS(ns,'title');title.textContent=p.d+' · '+p.count+' 次记录';dot.append(title)}}for(let i=0;i<days.length;i++){if(days.length>7&&i%5!==0&&i!==days.length-1)continue;el('text',{x:65+i*610/Math.max(1,days.length-1),y:190,fill:'#7e929b','font-size':11,'text-anchor':'middle'}).textContent=days[i].slice(5)}if(!pts.some(Boolean))el('text',{x:360,y:90,fill:'#82959d','font-size':14,'text-anchor':'middle'}).textContent='记录一次心情，让心流从这里开始';host.append(svg)}

const viewer=document.createElement('div');viewer.className='photo-viewer';viewer.hidden=true;viewer.setAttribute('role','dialog');viewer.setAttribute('aria-modal','true');viewer.setAttribute('aria-label','心情照片');viewer.innerHTML='<button class="viewer-close" aria-label="关闭大图">×</button><button class="viewer-prev" aria-label="上一张">‹</button><img alt="心情记录照片"><button class="viewer-next" aria-label="下一张">›</button><div class="viewer-meta"></div><div class="viewer-count"></div>';document.body.append(viewer);let gallery=[],galleryIndex=0,previousFocus;
function showPhoto(){let r=gallery[galleryIndex];viewer.querySelector('img').src=r.photo;viewer.querySelector('.viewer-meta').textContent=new Date(r.time).toLocaleString('zh-CN')+' · '+labels[r.mood-1];viewer.querySelector('.viewer-count').textContent=(galleryIndex+1)+' / '+gallery.length;viewer.querySelector('.viewer-prev').disabled=galleryIndex===0;viewer.querySelector('.viewer-next').disabled=galleryIndex===gallery.length-1;}
function movePhoto(delta){galleryIndex=Math.max(0,Math.min(gallery.length-1,galleryIndex+delta));showPhoto()}
function closePhoto(){viewer.hidden=true;document.body.style.overflow='';previousFocus?.focus()}
viewer.querySelector('.viewer-close').onclick=closePhoto;viewer.querySelector('.viewer-prev').onclick=()=>movePhoto(-1);viewer.querySelector('.viewer-next').onclick=()=>movePhoto(1);
let touchX=null,touchY=null;viewer.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;touchY=e.touches[0].clientY},{passive:true});viewer.addEventListener('touchend',e=>{if(touchX===null)return;let dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))movePhoto(dx<0?1:-1);touchX=null},{passive:true});let dragX=null;viewer.querySelector('img').addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){dragX=e.clientX;e.preventDefault();e.target.setPointerCapture(e.pointerId)}});viewer.querySelector('img').addEventListener('pointerup',e=>{if(dragX!==null&&Math.abs(e.clientX-dragX)>45)movePhoto(e.clientX<dragX?1:-1);dragX=null});
viewer.addEventListener('keydown',e=>{if(e.key==='Escape')closePhoto();if(e.key==='ArrowLeft')movePhoto(-1);if(e.key==='ArrowRight')movePhoto(1);if(e.key==='Tab'){const items=[...viewer.querySelectorAll('button')].filter(b=>!b.disabled);let i=items.indexOf(document.activeElement);e.preventDefault();items[(i+(e.shiftKey?-1:1)+items.length)%items.length].focus()}});
function openPhoto(record){gallery=records.filter(r=>r.photo&&r.photo.startsWith('data:image/jpeg;base64,')).slice().reverse();galleryIndex=gallery.indexOf(record);previousFocus=document.activeElement;showPhoto();viewer.hidden=false;document.body.style.overflow='hidden';viewer.querySelector('.viewer-close').focus()}

const panel=document.getElementById('observe');function reveal(){panel.hidden=false;requestAnimationFrame(()=>panel.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'}))}document.getElementById('enter').onclick=reveal;document.getElementById('navNow').onclick=e=>{e.preventDefault();reveal()};let frame;window.addEventListener('pointermove',e=>{if(frame)return;frame=requestAnimationFrame(()=>{document.documentElement.style.setProperty('--pointer-x',((e.clientX/innerWidth-.5)*24)+'px');document.documentElement.style.setProperty('--pointer-y',((e.clientY/innerHeight-.5)*15)+'px');document.documentElement.style.setProperty('--cat-turn',((e.clientX/innerWidth-.5)*18)+'deg');document.documentElement.style.setProperty('--cat-tilt',((e.clientY/innerHeight-.5)*-9)+'deg');document.documentElement.style.setProperty('--cat-roll',((e.clientX/innerWidth-.5)*5)+'deg');frame=null})},{passive:true});
</script><script type="module">const $=id=>document.getElementById(id),mq=matchMedia('(max-width:760px)');
const nav=document.createElement('nav');nav.className='mobile-nav';nav.innerHTML='<button id="mobileNow" class="active">◡<span>此刻</span></button><button id="mobileFlow">≋<span>心流</span></button>';document.body.append(nav);

const next=document.createElement('button');next.className='primary mobile-next';next.textContent='记录心情';

const photo=$('snapshot');details.before(photo);
let step='home';function view(state){if(!mq.matches)return;step=state;document.body.dataset.mobileView=state;if(state==='home'||state==='flow'){if(!$('stop').disabled)$('stop').click();$('observe').hidden=true}else $('observe').hidden=false;$('mobileNow').classList.toggle('active',state!=='flow');$('mobileFlow').classList.toggle('active',state==='flow');window.scrollTo({top:0,behavior:'instant'});}

$('enter').addEventListener('click',()=>{if(mq.matches)setTimeout(enter,0)});$('navNow').addEventListener('click',()=>{if(mq.matches)setTimeout(enter,0)});
direct.onclick=()=>view('confirm');back.onclick=()=>view(step==='mood'?'analysis':'home');retry.onclick=()=>{if(!$('stop').disabled)$('stop').click();view('observe');};next.onclick=()=>view('mood');$('mobileNow').onclick=()=>view('home');$('mobileFlow').onclick=()=>view('flow');document.querySelector('.scroll-cue').addEventListener('click',e=>{if(mq.matches){e.preventDefault();view('flow')}});
new MutationObserver(()=>{if(mq.matches&&step==='observe'&&!photo.hidden){view('analysis')}}).observe(photo,{attributes:true,attributeFilter:['hidden']});
$('save').addEventListener('click',()=>{if(mq.matches&&$('saved').textContent.startsWith('心情和快照已一起保存')||mq.matches&&$('saved').textContent.startsWith('已保存心情')){view('flow');let toast=document.createElement('div');toast.className='mobile-toast';toast.textContent='已记下此刻';document.body.append(toast);setTimeout(()=>toast.remove(),2500)}});

</script></body></html>
